<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위젯 미리 보기</title>
<style>
body { margin: 0; background: #000; color: #8592b0; font: 500 12px/1.4 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { width: 390px; margin: 0 auto; padding: 16px 26px 30px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 6px 22px; }
figure { margin: 0 0 12px; } figcaption { margin-top: 4px; }
svg { display: block; } svg text { font-family: inherit; }
.lock { width: 338px; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 22px; background: linear-gradient(160deg, #1b2440, #070b16); color: #fff; box-sizing: border-box; }
.lock .c { width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,.14); flex: none; }
.lock .r { flex: 1; border-radius: 14px; background: rgba(255,255,255,.14); padding: 7px 11px; font-size: 12px; white-space: nowrap; } .lock .r b { font-size: 13px; }
#inline { width: 338px; text-align: center; color: #fff; font-size: 13px; font-weight: 700; }
</style>
<script src="../vendor/astronomy.browser.min.js"></script>
</head>
<body>
<main id="out"></main>
<script type="module">
// 폰에 올리기 전에 같은 그리기 명령을 SVG로 본다. ?p=설정값 으로 관측지를 바꾼다(예: ?p=36.17,128.98|보현산)
import { makeSky } from '../js/sky.js';
import { loadForecast } from '../js/api.js';
import { widgetModel } from './data.js';
import { layout, lockText, lockCircle, KINDS } from './layout.js';
import { parseParam } from './param.js';
import { toSvg } from './svg.js';

const q = new URLSearchParams(location.search);
const { place } = parseParam(q.get('p'), 'small');
const data = await loadForecast(place.lat, place.lon).catch(() => null);
const m = widgetModel(makeSky(window.Astronomy), place, data, q.get('t') ? Date.parse(q.get('t')) : Date.now());
const out = document.getElementById('out');
const fig = (html, cap) => out.insertAdjacentHTML('beforeend', `<figure>${html}<figcaption>${cap}</figcaption></figure>`);
Object.keys(KINDS).forEach((k, i) => fig(toSvg(layout(k, m), { id: 'w' + i }), `${k} (${KINDS[k]})`));
const L = lockText(m), circ = k => `<div class="c">${toSvg(lockCircle(k, m), { radius: 33, id: 'l' + k })}</div>`;
fig(`<div class="lock">${circ('점수')}${circ('달')}<div class="r"><b>${L.title}</b><br>${L.lines.join('<br>')}</div></div>`, '잠금 화면: 원형(점수·달) · 사각형');
fig(`<div id="inline">${L.inline}</div>`, '잠금 화면: 날짜 줄');
document.body.dataset.ready = '1';
</script>
</body>
</html>
